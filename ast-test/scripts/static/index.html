<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ast-test · sherpa-onnx SenseVoice demo</title>
<style>
  :root {
    --bg: #0f1115; --fg: #e6e9ef; --mut: #8a93a3; --acc: #6ea8fe;
    --rec: #ff5a5a; --ok: #58d68d; --card: #171a21; --line: #232833;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 720px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 28px 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 22px; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  label { color: var(--mut); font-size: 13px; }
  select {
    background: #0c0e13; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit;
  }
  button {
    border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px ui-sans-serif;
    cursor: pointer; background: var(--acc); color: #0a0f1d;
    transition: transform .08s ease, background .15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  button.recording { background: var(--rec); color: #fff; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--mut); margin-right: 8px; vertical-align: middle;
  }
  .dot.live { background: var(--rec); animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,90,90,0.7); }
    50%      { box-shadow: 0 0 0 8px rgba(255,90,90,0);   }
  }
  .meter {
    height: 6px; flex: 1; background: #0c0e13; border-radius: 999px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .meter > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #58d68d, #6ea8fe, #ff5a5a);
    transition: width 60ms linear;
  }
  .out {
    margin-top: 18px; padding: 16px; background: #0c0e13; border: 1px solid var(--line);
    border-radius: 10px; min-height: 96px; white-space: pre-wrap; font-size: 16px;
  }
  .stats { color: var(--mut); font-size: 12px; margin-top: 8px; font-family: ui-monospace, monospace; }
  .err { color: #ff8a8a; }
  audio { width: 100%; margin-top: 14px; }
  footer { color: var(--mut); font-size: 12px; margin-top: 22px; text-align: center; }
  code { background: #0c0e13; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ast-test · sherpa-onnx SenseVoice (int8)</h1>
    <div class="sub">Press Record, speak, press Stop. Audio is decoded to 16 kHz mono via ffmpeg, then transcribed locally.</div>

    <div class="row">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="">auto</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="yue">粵語</option>
      </select>
      <button id="rec">● Record</button>
      <span><span id="dot" class="dot"></span><span id="state">idle</span></span>
    </div>

    <div class="row">
      <div class="meter"><i id="vol"></i></div>
    </div>

    <div class="out" id="out">Transcript will appear here.</div>
    <div class="stats" id="stats"></div>
    <audio id="play" controls hidden></audio>

    <footer>POST <code>/audio/transcriptions</code> — OpenAI-shaped, drop-in for the app's STT custom preset.</footer>
  </div>

<script>
const recBtn = document.getElementById("rec");
const dot    = document.getElementById("dot");
const state  = document.getElementById("state");
const out    = document.getElementById("out");
const stats  = document.getElementById("stats");
const vol    = document.getElementById("vol");
const lang   = document.getElementById("lang");
const play   = document.getElementById("play");

let mediaRecorder = null;
let chunks = [];
let stream = null;
let audioCtx = null;
let analyser = null;
let rafId = 0;

function setState(label, live) {
  state.textContent = label;
  dot.classList.toggle("live", !!live);
}

function startMeter(s) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(s).connect(analyser);
  const buf = new Uint8Array(analyser.fftSize);
  const tick = () => {
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) {
      const v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / buf.length);
    vol.style.width = Math.min(100, rms * 350) + "%";
    rafId = requestAnimationFrame(tick);
  };
  tick();
}

function stopMeter() {
  cancelAnimationFrame(rafId);
  vol.style.width = "0%";
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    out.innerHTML = `<span class="err">getUserMedia failed: ${e.message}</span>`;
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus"
    : "";
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onStop;
  mediaRecorder.start();
  startMeter(stream);
  setState("recording", true);
  recBtn.classList.add("recording");
  recBtn.textContent = "■ Stop";
}

async function stop() {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;
  mediaRecorder.stop();
  stream.getTracks().forEach(t => t.stop());
  stopMeter();
  recBtn.classList.remove("recording");
  recBtn.textContent = "● Record";
  setState("transcribing", false);
}

async function onStop() {
  const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
  play.src = URL.createObjectURL(blob);
  play.hidden = false;

  const form = new FormData();
  form.append("file", blob, "audio.webm");
  if (lang.value) form.append("language", lang.value);

  const t0 = performance.now();
  try {
    const r = await fetch("/audio/transcriptions", { method: "POST", body: form });
    const round = performance.now() - t0;
    if (!r.ok) {
      const err = await r.text();
      out.innerHTML = `<span class="err">${r.status}: ${err}</span>`;
      stats.textContent = "";
      setState("idle", false);
      return;
    }
    const j = await r.json();
    out.textContent = j.text || "(empty transcript)";
    stats.textContent =
      `audio ${j.audio_sec}s · decode ${j.decode_sec}s · infer ${j.infer_sec}s · ` +
      `rtf ${j.rtf} · round-trip ${(round/1000).toFixed(2)}s · lang ${j.lang_hint}`;
  } catch (e) {
    out.innerHTML = `<span class="err">request failed: ${e.message}</span>`;
  }
  setState("idle", false);
}

recBtn.addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") stop();
  else start();
});

setState("idle", false);
</script>
</body>
</html>
