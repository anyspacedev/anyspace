[project]
name = "teamship-backend"
version = "0.1.0"
description = "Teamship backend — phase 1: cloud transcription + skeleton for users/billing"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "starlette>=0.36",
    # Config + logging
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    # DB (SQLite now, swap to Postgres via DATABASE_URL in phase 2)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # ASR runtime — same pins as ast-test
    "sherpa-onnx==1.13.*",
    "onnxruntime>=1.24,<1.25",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface-hub>=0.24",
    # HTTP utilities
    "requests>=2.32",
    "httpx>=0.27",
    # Clerk JWT verification (RS256 via JWKS) + Svix webhook signatures
    "pyjwt[crypto]>=2.8",
    "svix>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit the real ASR model (deselect with -m 'not slow')",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
