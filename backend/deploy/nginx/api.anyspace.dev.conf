# AnySpace cloud backend — fronts FastAPI on 127.0.0.1:9100.
# Cloudflare orange-cloud terminates TLS at the edge; we present a
# self-signed cert here so CF "Full" mode connects (use a Cloudflare
# Origin CA cert if you switch to "Full (strict)").

# Trust Cloudflare-supplied client IP. Keep this list in sync with
# https://www.cloudflare.com/ips/. The X-Forwarded-For value Cloudflare
# inserts will replace $remote_addr for downstream consumers (FastAPI's
# `client_ip` dep already trusts X-Forwarded-For via TRUSTED_PROXY_IPS).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# :80 → 301 to https. Cloudflare's "Always Use HTTPS" makes this
# rarely used, but it covers direct-to-origin probes that skip CF.
server {
    listen      80;
    listen      [::]:80;
    server_name api.anyspace.dev;

    # ACME http-01 if we ever swap to a real cert via certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Explicit IPv4 because tailscaled holds 100.121.165.72:443
    # (tailnet-only HTTPS); a 0.0.0.0:443 bind would collide.
    listen              40.160.235.121:443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         api.anyspace.dev;

    ssl_certificate     /etc/ssl/anyspace/origin.crt;
    ssl_certificate_key /etc/ssl/anyspace/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 25 MB matches the backend's MAX_BODY_BYTES default.
    client_max_body_size 25m;

    # Audio transcription and chat completions can take a while.
    proxy_read_timeout  300s;
    proxy_send_timeout  120s;
    proxy_connect_timeout 10s;

    access_log /var/log/nginx/api.anyspace.dev.access.log;
    error_log  /var/log/nginx/api.anyspace.dev.error.log;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
