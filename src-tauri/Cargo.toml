[package]
name = "teamship"
version = "0.1.0"
description = "Teamship — orchestrate AI agents across multi-pane workspaces"
edition = "2021"
rust-version = "1.77"

[lib]
name = "teamship_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# PTY
portable-pty = "0.8"

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# fs watcher for live preview
notify = "6"
notify-debouncer-mini = "0.4"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"

# http probe for preview port detection
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }

# WebKitGTK isn't shown navigator.mediaDevices unless we toggle enable-media-stream
# on the WebView at startup and answer the permission-request signal — needed by
# the hold-to-talk recorder.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# macOS WKWebView hides navigator.mediaDevices on non-https origins by default.
# We poke the private WKPreferences keys at startup so the API is exposed; wry's
# WKUIDelegate already grants requestMediaCapturePermissionForOrigin.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSValue", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
