[package]
name = "anyspace"
version = "0.1.0"
description = "AnySpace — orchestrate AI agents across multi-pane workspaces"
edition = "2021"
rust-version = "1.77"

[lib]
name = "anyspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# PTY
portable-pty = "0.8"

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# fs watcher for live preview
notify = "6"
notify-debouncer-mini = "0.4"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
# flock(2) for the team-mode message-bus compactor — the same .lock file
# tmsg.sh holds during sends. Already a transitive dep via gtk/atk; pinning
# here just makes the call sites compile cleanly.
libc = "0.2"

# OS keychain for SSH host passwords. Backed by libsecret (Linux) /
# Keychain (macOS) / Credential Manager (Windows). `sync-secret-service`
# avoids pulling a second tokio runtime on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# http probe for preview port detection
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "socks", "stream"] }

# Local on-device STT via whisper.cpp. Optional behind the `local-stt`
# feature so contributors without cmake / a C++ toolchain can still
# `cargo check --no-default-features`. Per-platform GPU backends are
# enabled below in the target-specific dependency stanzas (Metal on macOS,
# Vulkan on Linux). Windows defaults to CPU; CUDA can be opted-in by
# self-builders.
whisper-rs = { version = "0.13", optional = true, default-features = false }

# in-process HTTP server that backs $ANYSPACE_API_URL for terminal-spawned
# Code Agents (drives Preview, returns screenshot paths). Loopback-only,
# bearer-token authed. axum 0.7 pairs cleanly with the tokio 1 runtime
# Tauri 2 already runs.
axum = "0.7"
tower-http = { version = "0.5", features = ["limit"] }
rand = "0.8"
hex = "0.4"

# One-shot loopback listener for the desktop OAuth callback. The browser
# completes Clerk sign-in (system browser → cookies work) and redirects to
# 127.0.0.1:<port>/callback?ticket=…&nonce=…; we read the ticket, redeem it
# via Clerk's "ticket" strategy in the WebView, and tear down. tiny_http is
# blocking-IO and tiny — no second tokio runtime, no axum boilerplate for
# what is literally two routes.
tiny_http = "0.12"

# screen-region capture for the preview pane screenshot button. xcap gives us
# pixel-perfect captures across cross-origin iframes, WebGL canvases, and
# embedded media — which DOM-serialisation libs can't reproduce. macOS prompts
# for Screen Recording permission once on first capture.
xcap = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Official MCP Rust SDK. Backs the in-process Streamable HTTP MCP endpoint
# (mounted at /mcp on the loopback agent_api server) that Claude Code and other
# MCP-aware clients connect to. Tool methods read X-Pane-Id / X-Tab-Id from
# the request via Extension<http::request::Parts>.
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-streamable-http-server"] }

# WebKitGTK isn't shown navigator.mediaDevices unless we toggle enable-media-stream
# on the WebView at startup and answer the permission-request signal — needed by
# the hold-to-talk recorder.
#
# device_query is the keyboard-poll backend for the Linux hold-to-talk monitor
# (stt/hotkey_monitor_linux.rs). WebKitGTK on Linux silently drops or stalls
# keyup events for modifier-only hotkeys, so we poll the X server directly
# instead of trusting the JS keydown/keyup path.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
device_query = "2"
# Vulkan backend for whisper.cpp on Linux GPUs. Requires the Vulkan SDK
# at build time; runtime probe falls back to CPU if no Vulkan device.
whisper-rs = { version = "0.13", optional = true, default-features = false, features = ["vulkan"] }

# Direct dependency on the Secret Service D-Bus client so we can bootstrap
# the user's default collection on first SSH password save. On fresh Debian/
# XFCE installs the login keyring is never created (no PAM login captures
# the user's password), so gnome-keyring runs with only an in-memory
# `session` collection and `Entry::new()` from the `keyring` crate fails
# with "no result found". Calling `create_collection("Login", "default")`
# pops `gcr-prompter` once to set a master password, then keychain works.
# Version pinned to the same minor `keyring` already pulls transitively.
dbus-secret-service = "4"
# Raw D-Bus access so we can call `org.freedesktop.DBus.UpdateActivationEnvironment`
# before triggering the keyring prompter. The session dbus-daemon often
# starts before the X session sets DISPLAY/XAUTHORITY; without those in
# its activation env, D-Bus-activated gcr-prompter spawns into the void
# and gnome-keyring reports the prompt as "dismissed". Propagating the
# Tauri process's display env to the daemon fixes that. Already in the
# tree transitively via `dbus-secret-service`.
dbus = "0.9"

# macOS WKWebView hides navigator.mediaDevices on non-https origins by default.
# We poke the private WKPreferences keys at startup so the API is exposed; wry's
# WKUIDelegate already grants requestMediaCapturePermissionForOrigin.
#
# objc2-app-kit/block2 are for the hold-to-talk NSEvent local monitor — see
# stt/hotkey_monitor.rs for why we intercept modifier keys at the AppKit layer
# instead of letting them reach WebKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSValue", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }
block2 = "0.6"
# Metal backend for whisper.cpp on Apple Silicon / Intel Mac GPUs.
whisper-rs = { version = "0.13", optional = true, default-features = false, features = ["metal"] }

[features]
default = ["local-stt"]
custom-protocol = ["tauri/custom-protocol"]
# Compiles in the on-device Whisper backend. Disable with
# `--no-default-features` if cmake / a C++ toolchain isn't available.
local-stt = ["dep:whisper-rs"]
