[package]
name = "teamship"
version = "0.1.0"
description = "Teamship — orchestrate AI agents across multi-pane workspaces"
edition = "2021"
rust-version = "1.77"
# Now that the package ships two binaries (the main app and `teamship-mcp`),
# `cargo run` and `tauri dev` need an explicit default — otherwise cargo
# refuses to pick between them.
default-run = "teamship"

[lib]
name = "teamship_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# PTY
portable-pty = "0.8"

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# fs watcher for live preview
notify = "6"
notify-debouncer-mini = "0.4"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
# flock(2) for the team-mode message-bus compactor — the same .lock file
# tmsg.sh holds during sends. Already a transitive dep via gtk/atk; pinning
# here just makes the call sites compile cleanly.
libc = "0.2"

# http probe for preview port detection
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "socks", "stream"] }

# in-process HTTP server that backs $TEAMSHIP_API_URL for terminal-spawned
# Code Agents (drives Preview, returns screenshot paths). Loopback-only,
# bearer-token authed. axum 0.7 pairs cleanly with the tokio 1 runtime
# Tauri 2 already runs.
axum = "0.7"
tower-http = { version = "0.5", features = ["limit"] }
rand = "0.8"
hex = "0.4"

# screen-region capture for the preview pane screenshot button. xcap gives us
# pixel-perfect captures across cross-origin iframes, WebGL canvases, and
# embedded media — which DOM-serialisation libs can't reproduce. macOS prompts
# for Screen Recording permission once on first capture.
xcap = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Official MCP Rust SDK. Powers the `teamship-mcp` stdio binary that Claude Code
# (and any MCP-aware client) spawns to talk to the loopback agent_api. Only the
# bin target actually uses it, but it sits in the shared [dependencies] block
# because we share a Cargo.toml with the main lib.
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io"] }

# WebKitGTK isn't shown navigator.mediaDevices unless we toggle enable-media-stream
# on the WebView at startup and answer the permission-request signal — needed by
# the hold-to-talk recorder.
#
# device_query is the keyboard-poll backend for the Linux hold-to-talk monitor
# (stt/hotkey_monitor_linux.rs). WebKitGTK on Linux silently drops or stalls
# keyup events for modifier-only hotkeys, so we poll the X server directly
# instead of trusting the JS keydown/keyup path.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
device_query = "2"

# macOS WKWebView hides navigator.mediaDevices on non-https origins by default.
# We poke the private WKPreferences keys at startup so the API is exposed; wry's
# WKUIDelegate already grants requestMediaCapturePermissionForOrigin.
#
# objc2-app-kit/block2 are for the hold-to-talk NSEvent local monitor — see
# stt/hotkey_monitor.rs for why we intercept modifier keys at the AppKit layer
# instead of letting them reach WebKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSValue", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }
block2 = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Stdio MCP bridge that Claude Code spawns. Calls the loopback REST API at
# $TEAMSHIP_API_URL using $TEAMSHIP_API_TOKEN / $TEAMSHIP_PANE_ID. Built as a
# sibling of the main `teamship` binary; located by current_exe()'s parent dir
# at runtime.
[[bin]]
name = "teamship-mcp"
path = "src/bin/teamship-mcp.rs"
