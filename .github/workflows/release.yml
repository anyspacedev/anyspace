name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no leading v, e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  R2_ENDPOINT: https://6a64935901a8e86c1ac52e765eebd46d.r2.cloudflarestorage.com
  R2_BUCKET: anyspace
  PUBLIC_BASE: https://get.anyspace.dev

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,    target: aarch64-apple-darwin,     label: mac-arm64 }
          - { os: macos-15-intel,  target: x86_64-apple-darwin,      label: mac-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   label: windows-x64 }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          # Per-target key: native modules differ between OSes and arches
          # (mac arm64 vs mac x64 share runner.os = "macOS"), so include target.
          key: node-modules-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Stamp release version into manifests
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Bump in-tree (not committed). tauri::generate_context! bakes
          # tauri.conf.json's version into the binary at compile time, and
          # @tauri-apps/api/app's getVersion() reads from there at runtime.
          # We deliberately do NOT bump src-tauri/Cargo.toml: changing the
          # local crate's package version invalidates its cached object
          # files (deps still cache fine), but contributes nothing to the
          # version reported by getVersion(). package.json is bumped so
          # any tooling that reads it (devtools, sourcemaps) stays consistent.
          node -e "const f='package.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          node -e "const f='src-tauri/tauri.conf.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "--- package.json ---"
          grep -E '"version"' package.json
          echo "--- tauri.conf.json ---"
          grep -E '"version"' src-tauri/tauri.conf.json

      - name: Resolve git short sha
        id: gitsha
        shell: bash
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Vite reads these at build time; without them the shipped bundle
          # falls back to "this build wasn't compiled with a Clerk key" and
          # AnySpace Cloud STT/AI is unavailable. The Clerk publishable key
          # is public-by-design but stored as a secret to keep it out of git.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_ANYSPACE_CLOUD_URL: https://api.anyspace.dev/v1
          VITE_GIT_SHA: ${{ steps.gitsha.outputs.sha }}
        with:
          args: --target ${{ matrix.target }}

      - name: Collect & rename artifacts
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          OUT="dist-release"
          mkdir -p "$OUT"
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          shopt -s nullglob

          case "$LABEL" in
            mac-*)
              for f in "$BUNDLE"/dmg/*.dmg; do
                cp "$f" "$OUT/AnySpace-${VERSION}-${LABEL}.dmg"
              done
              ;;
            windows-*)
              for f in "$BUNDLE"/msi/*.msi; do
                cp "$f" "$OUT/AnySpace-${VERSION}-${LABEL}.msi"
              done
              for f in "$BUNDLE"/nsis/*-setup.exe; do
                cp "$f" "$OUT/AnySpace-${VERSION}-${LABEL}-setup.exe"
              done
              ;;
            linux-*)
              for f in "$BUNDLE"/deb/*.deb; do
                cp "$f" "$OUT/AnySpace-${VERSION}-${LABEL}.deb"
              done
              for f in "$BUNDLE"/appimage/*.AppImage; do
                cp "$f" "$OUT/AnySpace-${VERSION}-${LABEL}.AppImage"
              done
              ;;
          esac

          echo "Collected:"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to R2 + landing
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with bot token for landing commit)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist-release/
          merge-multiple: true

      - name: List release artifacts
        run: ls -la dist-release/

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          aws s3 cp dist-release/ "s3://${R2_BUCKET}/v${VERSION}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "public, max-age=31536000, immutable" \
            --checksum-algorithm CRC32

      - name: Verify R2 listing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          aws s3 ls "s3://${R2_BUCKET}/v${VERSION}/" \
            --endpoint-url "${R2_ENDPOINT}"

      - name: Bump landing version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Single literal line in downloads.ts — keep the quoted form intact.
          sed -i -E "s|^export const LATEST_VERSION = \".*\";|export const LATEST_VERSION = \"${VERSION}\";|" \
            landing/src/lib/downloads.ts
          # Confirm change took effect.
          grep -n 'LATEST_VERSION = ' landing/src/lib/downloads.ts

      - name: Commit landing version bump
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet landing/; then
            echo "No landing changes to commit (already at v${VERSION})."
            exit 0
          fi
          git config user.name 'anyspace-release-bot'
          git config user.email 'release-bot@anyspace.dev'
          git add landing/src/lib/downloads.ts
          git commit -m "Release v${VERSION} [skip ci]"
          # Push to the default branch — works for both tag-push and dispatch.
          DEFAULT_BRANCH="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Cache landing node_modules
        id: landing-node-cache
        uses: actions/cache@v4
        with:
          path: landing/node_modules
          key: landing-node-modules-${{ runner.os }}-${{ hashFiles('landing/package-lock.json') }}

      - name: Install landing deps
        if: steps.landing-node-cache.outputs.cache-hit != 'true'
        working-directory: landing
        run: npm ci

      - name: Build + deploy landing to Cloudflare Workers
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a64935901a8e86c1ac52e765eebd46d
        run: |
          set -euo pipefail
          npm run build
          npx wrangler deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: AnySpace v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist-release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
